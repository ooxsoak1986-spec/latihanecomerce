<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>E-Commerce Sultan</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}

body {
  background: #0f0f0f;
  color: white;
}

/* NAVBAR */
header {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: black;
}

nav a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
}

/* HERO */
.hero {
  position: relative;
  height: 400px;
  overflow: hidden;
}

.hero input {
  display: none;
}

.hero-slides {
  display: flex;
  width: 300%;
  transition: 0.5s;
}

.hero-slide {
  width: 100%;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* BACKGROUND */
.bg1 { background: linear-gradient(135deg,#000,#1a1a1a); }
.bg2 { background: linear-gradient(135deg,#111,#222); }
.bg3 { background: linear-gradient(135deg,#000,#333); }

.hero-content h2 {
  color: #ff7a3d;
}

.hero-content button {
  margin-top: 10px;
  padding: 10px 20px;
  background: #ff7a3d;
  border: none;
  cursor: pointer;
}

/* SLIDE CONTROL */
#h1:checked ~ .hero-slides { transform: translateX(0); }
#h2:checked ~ .hero-slides { transform: translateX(-100%); }
#h3:checked ~ .hero-slides { transform: translateX(-200%); }

/* PANAH */
.hero-arrow {
  position: absolute;
  top: 50%;
  width: 100%;
  display: flex;
  justify-content: space-between;
  transform: translateY(-50%);
  padding: 0 20px;
}

.hero-arrow button {
  background: rgba(0,0,0,0.5);
  color: #ff7a3d;
  border: none;
  font-size: 24px;
  padding: 12px 18px;
  cursor: pointer;
  border-radius: 50%;
}

.hero-arrow button:hover {
  background: #ff7a3d;
  color: black;
}

/* PRODUK */
.produk {
  padding: 40px;
  text-align: center;
}

.grid {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 10px;
  width: 200px;
}

.card img {
  width: 100%;
}

.harga {
  color: #00ff99;
}

button {
  margin-top: 10px;
  padding: 8px;
  background: #ff7a3d;
  border: none;
  cursor: pointer;
}
</style>

</head>

<body>

<header>
  <h1>Okta-Gadget</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Produk</a>
    <a href="#">Kontak</a>
  </nav>
</header>

<!-- SLIDER -->
<section class="hero">

  <input type="radio" name="hero" id="h1" checked>
  <input type="radio" name="hero" id="h2">
  <input type="radio" name="hero" id="h3">

  <div class="hero-slides">
    <div class="hero-slide bg1">
      <div class="hero-content">
        <h2>Promo Gadget Terbaik 🔥</h2>
        <p>Produk terbaik dengan harga terbaik</p>
        <button>Beli sekarang</button>
      </div>
    </div>

    <div class="hero-slide bg2">
      <div class="hero-content">
        <h2>Gadget Pilihan Terbaik 🔥</h2>
        <p>Dak tau</p>
        <button>Lihat sekarang</button>
      </div>
    </div>

    <div class="hero-slide bg3">
      <div class="hero-content">
        <h2>Kualitas Gadget Terbaik 🔥</h2>
        <p>Dak tau</p>
        <button>Cek sekarang</button>
      </div>
    </div>
  </div>

  <!-- PANAH -->
  <div class="hero-arrow">
    <button onclick="prevSlide()">&#10094;</button>
    <button onclick="nextSlide()">&#10095;</button>
  </div>

</section>

<!-- PRODUK -->
<section class="produk">
  <h2>Produk Handphone Populer</h2>
  <div class="grid">
    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>Nexora 12</h3>
      <p class="harga">Rp3.499.000</p>
      <button>Beli</button>
    </div>
  </div>
</section>

<script>
let current = 1;
const total = 3;

function showSlide(n){
  document.getElementById("h"+n).checked = true;
}

function nextSlide(){
  current++;
  if(current > total) current = 1;
  showSlide(current);
}

function prevSlide(){
  current--;
  if(current < 1) current = total;
  showSlide(current);
}

/* AUTO SLIDE */
setInterval(() => {
  nextSlide();
}, 4000);
</script>

</body>
</html>
