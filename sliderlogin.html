<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body{
            color: white;
            background-image: url("untuk\ background.png");
        }
.kontak{
  width:90%;
  max-width:900px;
  margin:80px auto;
  padding:50px;
  backdrop-filter:blur(8px);
  border-radius:25px;
  text-align:center;
}
header h1 {
  font-size: 22px;
  background: linear-gradient(90deg, #ff7e5f, #feb47b);
  -webkit-background-clip: text;
  color: transparent;
}
nav {
  display: flex;
  gap: 25px;
}

nav a {
  color: white;
  text-decoration: none;
  position: relative;
  transition: 0.3s;
}

nav a:hover {
  color: #ff7e5f;
}

/* underline anim */
nav a::after {
  content: "";
  position: absolute;
  width: 0%;
  height: 2px;
  background: linear-gradient(90deg, #ff7e5f, #feb47b);
  bottom: -5px;
  left: 0;
  transition: 0.3s;
}

nav a:hover::after {
  width: 100%;
}

/* HAMBURGER */
.menu-toggle {
  display: none;
  font-size: 26px;
  cursor: pointer;
}
        header{
             backdrop-filter: blur(15px);
             background: rgba(0,0,0,0.6);
             border-bottom: 1px solid rgba(255,255,255,0.1);
             padding: 15px 30px;
             display: flex;
             justify-content: space-between;
             align-items: center;
             position: sticky;
             top: 0;
             z-index: 1000;
         }
        .container{
            width: 800px;
            height: 500px;
            backdrop-filter: blur(15px);
            background: rgba(0,0,0,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255,126,95,0.5);
        }
        #toggle{
            display: none;
        }
        .forms{
            position: relative;
            width: 100%;
            height: 100%;
        }
        .form-box{
            position: absolute;
            width: 100%;
            height: 100%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: 0.5s ease;
        }
        h2{
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
             color: transparent;
        }
        input{
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        input:focus{
            border-radius: #667eea;
        }
        button{
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .toggle-text{
            color: white;
            margin-top: 15px;
            font-size: 14px;
        }
        .toggle-text label{
         background: linear-gradient(90deg, #ff7e5f, #feb47b);
         -webkit-background-clip: text;
         color: transparent;
            cursor: pointer;
            font-weight: bold;
        }
        .login {
            opacity: 1;
            pointer-events: auto;
            width: 350px;
        }
        .register{
            opacity: 0;
            pointer-events: none;
            margin-left: 400px;
            width: 350px;
        }
        #toggle:checked~.forms .login{
            opacity: 0;
            pointer-events: auto;
        }
        #toggle:checked~.forms .register{
            opacity: 1;
            pointer-events: auto;
        }
        .overlay{
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            backdrop-filter: blur(15px);
            background: rgba(0,0,0,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(255,126,95,0.5);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            transition: all 0.5s ease;
        }
        #toggle:checked~.overlay{
            transform: translateX(-100%);
        }
        .overlay h2{
            margin-bottom: 10px;
        }
        .overlay p{
            font-size: 14px;
            margin-bottom: 20px;
        }
        .overlay label{
            padding: 10px 20px;
            border: 1px solid #fff;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .overlay label:hover{
            background: #fff;
            color: #667eea;
        }
    </style>
</head>
<body>
  <header>
  <h1>Okta-Gadget</h1>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <nav id="nav">
    <a href="PROJECT.html">Home</a>
    <a href="Kontak.html">Kontak</a>
    <a href="baru.html" onclick="openModal('login')">Login</a>
    <a href="sliderlogin.html" onclick="openModal('register')">Register</a>
  </nav>
</header>
<section class="kontak">
    <div class="container">
    <input type="checkbox" id="toggle">
    <div class="forms">
        <div class="form-box login">
        <h2>Register</h2>
        <input type="text" placeholder="Nama">
        <input type="email" placeholder="email">
        <input type="password" placeholder="password">
        <button>Register</button>

        <p class="toggle-text">
            Sudah punya akun?
            <label for="toggle">Login</label>
        </p>
        </div>

        <div class="form-box register">
            <h2>Login</h2>
            <input type="text" placeholder="Nama">
            <input type="email" placeholder="email">
            <input type="password" placeholder="password">
            <button>Login</button>

            <p class="toggle-text">
                Belum punya akun?
                <label for="toggle">Register</label>
            </p>
        </div>

    </div>

    <div class="overlay">
        <h2>Welcome</h2>
        <p>Pilih menu untuk berpindah antara login dan Register</p>
        <label for="toggle">toggle</label>
    </div>
</div>
</section>

</body>
</html>
