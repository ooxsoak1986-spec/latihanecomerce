<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider Bulat</title>
    <link rel="stylesheet" href="sliderbulat.css">
</head>
<body>
    <div class="slider">
        <input type="radio" name="slide" id="slide1" checked>
        <input type="radio" name="slide" id="slide2">
        <input type="radio" name="slide" id="slide3">

        <div class="slides">
            <div class="slide s1">
                <h2>Slide Pertama</h2>
                <p>Untuk Tampilan Slider Pertama</p>
           </div>
            <div class="slide s2">
                <h2>Slide Kedua</h2>
                <p>Untuk Tampilan Slider Kedua</p>
             </div>
            <div class="slide s3">
                <h2>Slide Ketiga</h2>
                <p>Untuk Tampilan Slider Ketiga</p>
            </div>
            </div>
        

        <div class="navigation">
            <label for="slide1"></label>
            <label for="slide2"></label>
            <label for="slide3"></label>
        </div>
    </div>
    
</body>
</html>
